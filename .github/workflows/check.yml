name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - run: mise run setup
      - run: mise run check
      - run: mise run test
      - run: mise run test:install-browser
      - run: mise run test:e2e
